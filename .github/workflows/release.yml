name: Release

# APK del canal GitHub: lo compila y lo firma esta Action desde el código del tag, con una clave
# PROPIA del canal (no la upload key de Play, que no sale del PC del dueño). La versión de Play la
# vuelve a firmar Google y le añade su protección, así que no se mezclan sin desinstalar.
#
# - push de un tag v* → compila, verifica y publica el release con su attestation.
# - workflow_dispatch → ensayo: compila, firma y verifica, y deja el APK como artifact. Con
#   publicar=true solo publica si se lanza SOBRE un tag (para reintentar uno que falló).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publicar:
        description: 'Publicar el release (solo lanzado sobre un tag v*)'
        type: boolean
        default: false

permissions:
  contents: write      # crear el release
  id-token: write      # attestation
  attestations: write  # attestation

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    env:
      PUBLICAR: ${{ github.ref_type == 'tag' && (github.event_name == 'push' || inputs.publicar) }}
    steps:
      # Acciones fijadas por SHA: un tag se puede mover, un commit no.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Versión y guarda del tag
        run: |
          NOMBRE=$(grep -oP 'versionName "\K[^"]+' app/build.gradle)
          CODIGO=$(grep -oP 'versionCode \K[0-9]+' app/build.gradle)
          [ -n "$NOMBRE" ] && [ -n "$CODIGO" ] || { echo "::error::No se pudo leer la versión de app/build.gradle"; exit 1; }
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.publicar }}" = "true" ] && [ "${{ github.ref_type }}" != "tag" ]; then
            echo "::error::Para publicar hay que lanzar el workflow sobre un tag v*, no sobre ${{ github.ref_name }}"; exit 1
          fi
          if [ "${{ github.ref_type }}" = "tag" ] && [ "${{ github.ref_name }}" != "v$NOMBRE" ]; then
            echo "::error::El tag ${{ github.ref_name }} no es v$NOMBRE (versionName de app/build.gradle)"; exit 1
          fi
          echo "NOMBRE=$NOMBRE" >> "$GITHUB_ENV"
          echo "CODIGO=$CODIGO" >> "$GITHUB_ENV"
          echo "Versión $CODIGO / $NOMBRE · publicar=$PUBLICAR"

      - name: Clave del canal GitHub
        env:
          FIRMA_JKS_B64: ${{ secrets.FIRMA_JKS_B64 }}
          FIRMA_STORE_PASSWORD: ${{ secrets.FIRMA_STORE_PASSWORD }}
          FIRMA_KEY_ALIAS: ${{ secrets.FIRMA_KEY_ALIAS }}
          FIRMA_KEY_PASSWORD: ${{ secrets.FIRMA_KEY_PASSWORD }}
        run: |
          umask 077
          printf '%s' "$FIRMA_JKS_B64" | base64 -d > foroplus-github.jks
          {
            printf 'storeFile=../foroplus-github.jks\n'
            printf 'storePassword=%s\n' "$FIRMA_STORE_PASSWORD"
            printf 'keyAlias=%s\n' "$FIRMA_KEY_ALIAS"
            printf 'keyPassword=%s\n' "$FIRMA_KEY_PASSWORD"
          } > keystore.properties
          echo "Clave escrita ($(stat -c %s foroplus-github.jks) bytes)"

      - name: Tests y APK release
        run: ./gradlew testDebugUnitTest assembleRelease --no-daemon --console=plain

      - name: Verificar el APK
        env:
          CERT_ESPERADO: ${{ vars.FIRMA_CERT_SHA256 }}
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)
          echo "build-tools: $BT"
          [ -n "$CERT_ESPERADO" ] || { echo "::error::Falta la variable FIRMA_CERT_SHA256"; exit 1; }

          FIRMAS=$("$BT/apksigner" verify --print-certs "$APK")
          echo "$FIRMAS" | grep -E 'Signer #|certificate DN|certificate SHA-256'
          CERTS=$(echo "$FIRMAS" | grep -oP 'certificate SHA-256 digest: \K[0-9a-f]+' | sort -u)
          [ "$CERTS" = "$CERT_ESPERADO" ] || { echo "::error::Certificado $CERTS, esperado $CERT_ESPERADO"; exit 1; }

          PAQUETE=$("$BT/aapt2" dump badging "$APK" | head -1)
          echo "$PAQUETE"
          echo "$PAQUETE" | grep -q "^package: name='com.foroplus.app' versionCode='$CODIGO' versionName='$NOMBRE'" \
            || { echo "::error::El APK no es com.foroplus.app $CODIGO / $NOMBRE"; exit 1; }

          # Nuestro código, no el de Play: la protección de Play inyecta com.pairip.*
          rm -rf dex && mkdir dex && unzip -q -o "$APK" 'classes*.dex' -d dex
          CLASES=0; PAIRIP=0
          for d in dex/classes*.dex; do
            T=$("$BT/dexdump" "$d" | grep -cE "Class descriptor +: 'L" || true)
            P=$("$BT/dexdump" "$d" | grep -cE "Class descriptor +: 'Lcom/pairip/" || true)
            CLASES=$((CLASES + T)); PAIRIP=$((PAIRIP + P))
          done
          echo "Clases: $CLASES · com.pairip: $PAIRIP"
          [ "$PAIRIP" -eq 0 ] || { echo "::error::El APK lleva clases com.pairip"; exit 1; }
          if grep -aq 'Lcom/pairip' dex/classes*.dex; then echo "::error::Referencias a com.pairip en el dex"; exit 1; fi

      - name: Nombre final y SHA-256
        run: |
          FINAL="ForoPlus-$NOMBRE.apk"
          cp app/build/outputs/apk/release/app-release.apk "$FINAL"
          sha256sum "$FINAL" | tee "$FINAL.sha256"
          echo "FINAL=$FINAL" >> "$GITHUB_ENV"
          echo "APK_SHA256=$(cut -d' ' -f1 "$FINAL.sha256")" >> "$GITHUB_ENV"

      - name: APK como artifact (ensayo)
        if: env.PUBLICAR != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ForoPlus-${{ env.NOMBRE }}-ensayo
          path: |
            ${{ env.FINAL }}
            ${{ env.FINAL }}.sha256
          retention-days: 7

      - name: Attestation
        if: env.PUBLICAR == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: ${{ env.FINAL }}

      - name: Publicar el release
        if: env.PUBLICAR == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CERT: ${{ vars.FIRMA_CERT_SHA256 }}
        run: |
          NOVEDADES=$(jq -r --argjson c "$CODIGO" '.versiones[] | select(.code == $c) | .notas[] | "- " + .' app/src/main/assets/novedades.json)
          [ -n "$NOVEDADES" ] || { echo "::error::No hay notas para el versionCode $CODIGO en novedades.json"; exit 1; }
          {
            echo "## Novedades"
            echo
            echo "$NOVEDADES"
            echo
            echo "## Verificar"
            echo
            echo "- SHA-256 del APK: \`$APK_SHA256\`"
            echo "- SHA-256 del certificado de firma: \`$CERT\`"
            echo
            echo "Compilado y firmado por GitHub Actions desde este tag; no se actualiza mezclado con la versión de Google Play."
            echo
            echo '```'
            echo "gh attestation verify $FINAL -R ${{ github.repository }}"
            echo '```'
          } > notas.md
          cat notas.md
          gh release create "${{ github.ref_name }}" --verify-tag --title "ForoPlus $NOMBRE" \
            --notes-file notas.md --latest "$FINAL"

      - name: Borrar la clave del runner
        if: always()
        run: rm -f foroplus-github.jks keystore.properties
