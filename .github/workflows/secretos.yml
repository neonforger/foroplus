name: Secretos

on:
  push:
  pull_request:

# Solo lectura: la acción lee los commits (también los de un PR) y no escribe nada.
permissions:
  contents: read
  pull-requests: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      # Acciones fijadas por SHA: un tag se puede mover, un commit no.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Con permisos de solo lectura no puede comentar en el PR; el fallo del check basta.
          GITLEAKS_ENABLE_COMMENTS: false
